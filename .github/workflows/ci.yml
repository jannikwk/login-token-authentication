name: CI

on:
  pull_request:
    paths:
      - 'server/**'
      - 'shared/**'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Backend typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck source
        run: npm run typecheck

      - name: Typecheck tests
        run: npx tsc --noEmit -p test

      - name: Run tests
        run: npm test
